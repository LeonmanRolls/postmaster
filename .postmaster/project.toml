# <project>/.postmaster/project.toml
# What this project requires of every run against it. Committed with `git add -f`, the one
# file in .postmaster/ that travels. The shape is project.example.toml.

[project]
risk_surfaces = [
  "spawns agent CLIs in their bypass modes, in Herdr over its socket or in tmux",
  "uses the user's gh login, and reads PLANE_API_KEY and lane env files under ~/.postmaster",
  "writes ~/.postmaster, skill links into each harness's skills folder, and worktrees, branches, pushes and pull requests in target repos",
  "merges on the merge word",
  "binds no port, and serves only the GitHub Pages site",
]

[checks.gate]
command = '''bash -c 'for f in scripts/*.sh; do bash -n "$f" || exit 1; done && scripts/skill-refs.sh && scripts/wiki-lint.sh && for n in cut-scratch export-session fixture front-door front-door-acceptance github host launch link-skills local log-action parallel-runs-acceptance plane project-settings raw-promote review-decide review-findings review-forms review-round reviewers run-log run-meta run-times runs-status runs-watch scrub-check scrub-rewrite setup skill-refs spec-decisions spec-review-link stage style-findings ticket-check tool-faults tree-check turnpikes verify verify-examples verify-journey verify-library view-stream wait-for-markers wiki-lint; do scripts/$n.sh --self-test || exit 1; done'''
shows = "Every script parses, the runbook references and wiki lint clean, and the 44 script self-tests pass."

[checks.scrub]
command = "scripts/scrub-check.sh main HEAD"
shows = "no added line, commit message or merge resolution from base to head carries private data"

[checks.tree]
command = "scripts/tree-check.sh main HEAD"
shows = "nothing under .postmaster/ is staged or committed, and every added raw/ file scans clean"

[checks.wiki-lint]
command = "scripts/wiki-lint.sh"
shows = "no wiki page carries a private path or hostname, or a line quoted from raw/"
