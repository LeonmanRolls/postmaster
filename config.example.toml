# ~/.postmaster/config.toml
#
# The user's machine-level choices, and nothing about any target project. Projects are
# discovered (scripts/run discover-project), never configured. scripts/run setup writes this
# file from your answers; copy it by hand if you prefer. Model ids are whatever the provider
# serves under the harness; confirm each with one trial launch (scripts/run launch form <name>
# prints the exact command). Every value below is one that scripts/run launch can run today.
# A run keeps the config it was dispatched with, recorded in its run.json: an edit here
# reaches the next run, never one already in flight.

# Where projects live. scripts/run find-projects reads this when given no roots.
projects_roots = ["~/Code"]

# A lane is a harness plus a model plus an effort, and is a workhorse or a reviewer or
# both, as [team] says. Name lanes for what they are. A lane may carry an env_file, loaded
# before launch, which is how a harness reaches an alternate backend (an Anthropic-compatible
# endpoint under the claude harness, say): the endpoint and its key live in that file, outside
# this repo, never here. The [1m] suffix on a model id tells the claude harness the context
# window of an id it does not know.
[lanes.luna]
harness = "codex"
model = "gpt-5.6-luna"
effort = "max"

[lanes.deepseek]
harness = "claude"
model = "deepseek-v4.1-flash[1m]"
env_file = "~/.postmaster/lanes/deepseek.env"   # ANTHROPIC_BASE_URL and ANTHROPIC_AUTH_TOKEN

[lanes.mimo]
harness = "mimo"                                # MiMo Code; its model is provider/model
model = "<plan-provider>/mimo-v2.6-pro"         # the provider id of your key's plan
effort = "high"                                 # MiMo V2.6 Pro's variants are low, medium, high
env_file = "~/.postmaster/lanes/mimo.env"       # XIAOMI_API_KEY=<key>

# The team for a run. At least two workhorses from different vendors. Reviewers are lanes too, the
# workhorses by default; a third lane of another family may be added. The coachman and its fallback
# are never a model that runs as a lane in the same run, and both need a harness with a
# resume form (codex, grok, claude, pi, muse or mimo), since rulings arrive by resuming the
# coachman's thread.
[team]
workhorses = ["luna", "deepseek"]
reviewers = ["luna", "deepseek"]
coachman = { harness = "grok", model = "grok-4.6", effort = "xhigh" }
coachman_fallback = { harness = "codex", model = "gpt-6-astra", effort = "max" }
postmaster = { harness = "agy", model = "gemini-3.8-flash-high" }   # interactive, in tmux
max_runs = 2                                    # concurrent runs per project

# A muse coachman takes its key from an env file, as any role may:
# coachman = { harness = "muse", model = "muse-spark-1.3-contributor", effort = "max",
#              env_file = "~/.postmaster/lanes/muse.env" }     # holds META_API_KEY=<key>

# Optional: a different coachman per leg. The legs are synthesis and review (and ship for a
# run dispatched before the two-leg change), and scripts/run launch refuses a config that names
# any other.
# [team.coachman_legs]
# synthesis = { harness = "codex", model = "gpt-6-astra", effort = "max" }

# Optional: a lens's own reviewer lanes, where they differ from `reviewers`, such as a lane
# whose harness has a skill for that lens alone. A lens not named here is reviewed by
# `reviewers`. The lenses are the review stage's: `scripts/run reviewers lenses` lists them, and
# `scripts/run reviewers lines` refuses any other name, or a lane not defined above.
# [team.lens_reviewers]
# security = ["luna", "deepseek", "sentinel"]   # sentinel: a third lane, defined under [lanes]

# Per-launch resource limits. On Linux with a working systemd user manager, each run host run
# gets its own cgroup. Role values override either default; omitted values inherit from [limits].
[limits]
memory_max = "8G"
tasks_max = 512

# [limits.lane]
# memory_max = "12G"
# tasks_max = 768
# [limits.coachman]
# memory_max = "8G"
# tasks_max = 512
# [limits.reviewer]
# memory_max = "6G"
# tasks_max = 384

[postmaster]
poll_seconds = 120

# How tickets are read and written (skills/postmaster/trackers.md).
#   github  GitHub Issues on a GitHub Projects board, through the gh CLI (the default; needs
#           gh logged in with the project scope, nothing else)
#   plane   Plane work items through its REST API; url and workspace here, the key in env_file
#   local   tickets in each repository's own git directory, through scripts/run local; no
#           service, no login, nothing more here. A repository whose store exists uses it
#           whatever this kind is.
#   other   a tracker the agent reaches through its own tooling, named here and described in
#           ~/.postmaster/trackers/<name>.md
[tracker]
kind = "github"
# url = "https://api.plane.so"           # plane only: cloud, or a self-hosted instance's origin
# workspace = "<slug>"                   # plane only
# env_file = "~/.postmaster/plane.env"   # plane only: one line, PLANE_API_KEY=<key>
# name = "<tracker>"                     # other only
postmaster_may_create = false   # true lets the postmaster create tickets without asking

[review]
# Seconds a review round may run; a run keeps the value recorded in its run.json at dispatch.
# A reviewer still running at the limit is stopped and recorded DEGRADED, with timeout as the
# cause (scripts/run review-round). 2400 when unset.
round_timeout_seconds = 2400

[planning]
# Optional. A template for the link that puts the run's one spec to the user during the
# planning stage, with {path} replaced by the absolute path of the folder that holds
# WORKHORSE-SPEC.md under review (code-server opens folders). Leave empty to send the
# file's path alone. The host is private to this machine, so it lives here and never in
# a ticket.
review_link = ""

[ship]
# Who authorizes a local merge: "user" (a person, live) or "postmaster" (the supervising
# session merges after it verifies the ship card). Pull-request projects are merged
# by the user in their review surface. A current coachman never merges; a pre-change ship leg
# keeps the behavior it was dispatched with.
merge_authority = "user"

# "autonomous": the coachman posts checkpoint cards as information and proceeds; the ship
# card is the one stop. "consult": every checkpoint card is a stop until a ruling arrives.
checkpoint_mode = "autonomous"

# Optional. A template for the review link the ship card carries, with {path} replaced by the
# absolute path of the synthesis worktree. Leave empty to ship the path alone.
review_link = ""
