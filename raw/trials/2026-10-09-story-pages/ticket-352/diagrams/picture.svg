<svg class="dg" viewBox="0 0 360 286" role="img" aria-label="The session describes the scene in the story file. Codex's image tool draws it, with the postmaster poster as its style reference, in about two minutes. The session looks at the picture, lettering included, before it goes on the page.">
  <defs><marker id="ah-pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bx" x="12" y="12" width="156" height="58" rx="8"/>
  <text class="t1" x="24" y="34">The scene</text>
  <text class="t2" x="24" y="52">described in the story</text>
  <rect class="bx" x="192" y="12" width="156" height="58" rx="8"/>
  <text class="t1" x="204" y="34">The poster</text>
  <text class="t2" x="204" y="52">the style to follow</text>
  <path class="ln" d="M90,70 V92 H170 V104" marker-end="url(#ah-pc)"/>
  <path class="ln" d="M270,70 V92 H190 V104" marker-end="url(#ah-pc)"/>
  <rect class="bx hot" x="92" y="106" width="176" height="52" rx="8"/>
  <text class="t1" x="104" y="128">Codex's image tool</text>
  <text class="t2" x="104" y="146">about two minutes a picture</text>
  <line class="ln" x1="180" y1="158" x2="180" y2="180" marker-end="url(#ah-pc)"/>
  <rect class="bx" x="92" y="182" width="176" height="40" rx="8"/>
  <text class="t1" x="104" y="207">The session looks at it</text>
  <line class="ln" x1="180" y1="222" x2="180" y2="244" marker-end="url(#ah-pc)"/>
  <text class="t3" x="188" y="238">lettering right</text>
  <rect class="bx ok" x="92" y="246" width="176" height="32" rx="8"/>
  <text class="t1 ok" x="104" y="267">On the page</text>
  <text class="t3 bad" x="276" y="202">wrong:</text>
  <text class="t3 bad" x="276" y="216">draw again</text>
  <path class="ln dash" d="M268,196 C300,190 300,150 270,138" marker-end="url(#ah-pc)"/>
