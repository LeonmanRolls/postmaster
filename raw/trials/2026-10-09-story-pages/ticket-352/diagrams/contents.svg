<svg class="dg" viewBox="0 0 360 262" role="img" aria-label="What the ticket asks for, in five parts: a section for each criterion, a picture to start, the panel follows you, drawn before code, and the code it cites shown. Then nine decisions, three of them yours already.">
  <text class="t3" x="16" y="16">what must be true</text>
