<svg class="dg" viewBox="0 0 360 232" role="img" aria-label="Decision 1. Now, with this ticket: you ask a session and it makes the story. Next, with a follow-up: the booking clerk makes a story with every draft it shows you, beside the document you comment in.">
  <defs><marker id="ah-d1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
