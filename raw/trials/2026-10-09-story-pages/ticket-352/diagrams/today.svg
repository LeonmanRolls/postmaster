  <text class="t2 mono" x="102" y="218">review-page.ts L63</text>
  <text class="t2 mono" x="102" y="234">AGENTS.md L321</text>
  <text class="t2 mono" x="102" y="250">SKILL.md</text>
  <rect class="dimbar" x="102" y="262" width="150" height="3"/><rect class="dimbar" x="102" y="269" width="110" height="3"/>
  <path class="ln dash" d="M232,226 C266,226 280,214 292,196"/>
  <text class="t2" x="292" y="166">the code</text>
  <text class="t2" x="292" y="182">is only</text>
  <text class="t2" x="292" y="198">a link</text>
  <text class="t2" x="16" y="96">all of it</text>
  <text class="t2" x="16" y="112">at once</text>
