# The check on every pull request, on both systems the tool supports: Linux and a Mac on
# Apple silicon, each running the full check, plus the refusal a too-old Bun must print
# from the start command before any script loads. The Mac job keeps the bash every Mac
# comes with; the old-Bun job installs no dependencies, so nothing can mask a version
# check that does not run first. A manual dispatch with files runs only those test files
# on the Mac, for fast feedback while fixing it; empty files runs the full check.
# A pull request that changes only wiki/ and raw/ gets the wiki workflow (wiki.yml) instead.
name: check
on:
  pull_request:
    # A pull request whose files are all under wiki/ or raw/ is checked by the wiki workflow
    # instead; any other file in it brings this full check back.
    paths-ignore:
      - "wiki/**"
      - "raw/**"
  workflow_dispatch:
    inputs:
      files:
        description: "Test files to run on macOS only, space-separated; empty runs everything"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  linux:
    name: linux
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The tests read old commits.
          fetch-depth: 0
      - name: The minimum Bun the manifest names
        id: bun
        run: |
          min=$(node -e "const m = require('./package.json').engines.bun.match(/[0-9]+(\.[0-9]+)+/); console.log(m[0])")
          echo "version=$min" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: zsh, so the bash and zsh comparison runs here too
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bun install --frozen-lockfile
      - run: bun run check
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The tests read old commits.
          fetch-depth: 0
      - name: The bash every Mac comes with
        run: |
          ver=$(/usr/bin/env bash -c 'printf %s "$BASH_VERSION"')
          echo "/usr/bin/env bash is $ver"
          case "$ver" in
            3.2.*) ;;
            *) echo "expected the macOS system bash 3.2, found $ver" >&2; exit 1 ;;
          esac
      - name: The minimum Bun the manifest names
        id: bun
        run: |
          min=$(node -e "const m = require('./package.json').engines.bun.match(/[0-9]+(\.[0-9]+)+/); console.log(m[0])")
          echo "version=$min" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - name: The full check, or only the named test files on a manual run
        # Bound, never interpolated: the script validates FILES against the tracked test files.
        env:
          FILES: ${{ inputs.files }}
        run: |
          if [ -n "$FILES" ]; then
            bun scripts/manual-test-files.ts
          else
            bun run check
          fi
  old-bun:
    name: old-bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 1.3.14 is the Bun the report behind #217 ran: a real older Bun, no install, so
      # every script started through the start command must stop on the version message.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun scripts/old-bun.ts
