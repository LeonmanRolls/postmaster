[[parts]]
id = "completion"
title = "Leg completion detection"
definition = """
A leg is complete only when it writes a current-state handoff with these nonempty sections:
Decisions, Deferred findings, Verified by execution, Unverified, Branches and lanes, Open
questions, and Next leg. `handoff-check.sh` must exit 0; then the coachman closes the open
run-log section, logs `handoff`, and writes `.leg-<n>-done`. host.sh independently writes
`.leg-<n>-exited` when a process has ended or failed to start after its reason was recorded.
For an open run, runs-status.sh checks in order: `.waiting-on-user` (USER),
`.escalation-ready` (RULE), `.card-ready` (GATE), the current leg's done marker (DISPATCH),
its exited marker (REMOUNT), any checkpoint-ready marker (READ), 30 minutes with no file
activity (INSPECT), then active file activity (WAIT). A manifest stage of done or abandoned
returns `-` before those checks. A `.card-ready` marker means the ship card is ready for the
postmaster gate, not that the run or merge is complete.
"""

