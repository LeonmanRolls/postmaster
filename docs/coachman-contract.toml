[[parts]]
id = "turnpikes"
title = "Turnpike table"
definition = """
The table defines each turnpike's name, whether it is in `default`, the leg that runs it,
and what it checks. Its rows are: `style default review` for idiom, naming, abstraction and
consistency with project conventions; `bug default review` for correctness, logic and test
adequacy; and `security default review` for exploit paths through project risk surfaces. The
project's gate always runs separately. A ticket chooses its turnpikes; review runs only when
a chosen turnpike belongs to the review leg.
"""

