# The coachman contract, as a list of files. A change anywhere in a listed
# file is a contract change. version must stay 1. detector is the checker's
# repo-relative path, read from BASE's index.
version = 1
detector = "scripts/coachman-contract.ts"

[[files]]
path = "docs/coachman-contract.toml"
holds = "this list; changing which files the contract covers is a contract change"

[[files]]
path = "skills/postmaster/coachman.md"
holds = "marker tables and ownership, legs and stages, completion, turnpike steps, launch marker calls"

[[files]]
path = "skills/postmaster/postmaster.md"
holds = "marker reading and clearing, stage ownership, waybill writing, leg dispatch and resume, the fixture check"

[[files]]
path = "skills/postmaster/SKILL.md"
holds = "the waybill template, including the fixture requirement lines"

[[files]]
path = "scripts/run"
holds = "the entry every tool script runs through: name validation, resolution and the isolation flags"

[[files]]
path = "scripts/host.ts"
holds = "marker writing and clearing, the exit watcher and its call, the workhorse launch it composes, and the pidfile process-group stop"

[[files]]
path = "scripts/runs-status.ts"
holds = "marker polling, the completion poll and NEXT derivation"

[[files]]
path = "scripts/turnpikes.ts"
holds = "the turnpike table and leg derivation with its dispatch"

[[files]]
path = "scripts/stage.ts"
holds = "the stage transitions with the terminal-stage and skip-refusal rules"

[[files]]
path = "scripts/lib/stages.ts"
holds = "the stage list and the run's expected stage order"

[[files]]
path = "scripts/handoff-check.ts"
holds = "the required handoff sections"

[[files]]
path = "scripts/leg-end.ts"
holds = "the leg's end: the hand-off check, the handoff log line and every end marker"

[[files]]
path = "scripts/coachman-contract.ts"
holds = "the detector itself, whole: classification, command and controls"

[[files]]
path = "scripts/landing.ts"
holds = "the landing's deterministic checks: landed state, freshness, card rendering and matching, journey gating, and the ship card's reach section rendering"

[[files]]
path = "scripts/runs-watch.ts"
holds = "the mechanical leg steps, next-leg dispatch and transient remounts, and what wakes the postmaster"

[[files]]
path = "scripts/lib/wait.ts"
holds = "the external wait a run records in wait.json: its shapes, its validation, and when it reads over or at fault"

[[files]]
path = "scripts/walls.ts"
holds = "the wall record's shape, the ruling refusals, and the escalation a pause writes; the wall's entrypoint: show, open, told, rule, escalate, carry"

[[files]]
path = "scripts/lib/wall.ts"
holds = "the reset forms a wall message gives (D4, D5)"

[[files]]
path = "scripts/run-meta.ts"
holds = "the coachman contract version recorded in run.json"

[[files]]
path = "scripts/ticket-check.ts"
holds = "the flow's one reading of whether a ticket mentions a user journey"

[[files]]
path = "scripts/premises.ts"
holds = "the premise comparison command the coachman invokes before any workhorse starts; the cited-source comparison between the ticket's verified commit and the run base"

[[files]]
path = "scripts/ticket-ready.ts"
holds = "the readiness command the postmaster invokes before every dispatch; the readiness check: both ticket checks plus the ready mark"

[[files]]
path = "scripts/launch.ts"
holds = "the attempt phase: refused before preflight, started once the harness is callable"

[[files]]
path = "scripts/fixture.ts"
holds = "the fixture command the flow invokes; the fixture-copy mark new writes, and scoring a run from its records"

[[files]]
path = "scripts/reach.ts"
holds = "lane record reading, round snapshots and restoration"

[[files]]
path = "scripts/check-target.ts"
holds = "the main-checkout reach reading the reach check compares against"

[[files]]
path = "scripts/log-action.ts"
holds = "the reach action the reach check records"

[[files]]
path = "scripts/summary-evidence.ts"
holds = "the evidence-shape enforcement the runbook invokes at harvest"

[[files]]
path = "scripts/review-round.ts"
holds = "the review round's cut, launch and harvest: the gate check and its action, the open lenses and scratches, every reviewer through the host, the wait's pairs, and the bug report harvest"

[[files]]
path = "scripts/synthesis-shares.ts"
holds = "the SHARES measurement the runbook invokes: the synthesis HEAD it reads, the record, and the line it appends to the run log"

[[files]]
path = "scripts/project-settings.ts"
holds = "the run root and the worktree exclude the runbooks invoke, beside the project settings a run reads"

[[files]]
path = "scripts/aftercare.ts"
holds = "the run's cleanup: which folders go, how they are saved, the closing steps and the summary"

[[files]]
path = "scripts/take-in.ts"
holds = "the take-in step: quiescence and commit identity before synthesis"

[[files]]
path = "scripts/merge-default.ts"
holds = "the pre-card merge step: the freshness question, the merge and its log, the count, and the card's report"
