[[parts]]
id = "markers"
title = "Run and leg markers"
definition = """
The postmaster creates the run directory and initial manifest. A coachman leg owns its
handoff, checkpoint, escalation and ship-card artifacts. `.leg-<n>-done` is written only
after the handoff passes handoff-check.sh and the handoff is logged. `.leg-<n>-exited` is
written by host.sh when the launch reaches a terminal state: the process exited, or startup
failed after its reason was recorded. It is written regardless of the command's exit status;
host.sh clears it before a new launch or resume. A workhorse marker at `logs/<lane>.done` and
a reviewer marker at `logs/review-r<round>-$LENS-<lane>.done` are written by host.sh when that
process exits. The coachman writes `.card-ready` after the ship card and handoff are complete,
and again after updating the card. It writes `.escalation-ready` with ESCALATION.md and
`.checkpoint-<n>-ready` with a checkpoint card. The review leg also writes
`.checkpoint-review-ready` with checkpoint-review.md. The postmaster writes
`.waiting-on-user` with its question. It removes that marker when the answer arrives, removes
`.checkpoint-*-ready` after reading the card, removes `.escalation-ready` before resuming a
ruling, and removes `.card-ready` before resuming a merge decision. It may clear a leg's done
marker before requiring that leg to run again. Markers signal artifacts or process state;
they do not replace those artifacts.
"""

