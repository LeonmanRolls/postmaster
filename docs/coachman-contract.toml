[[parts]]
id = "legs-stages"
title = "Legs and stages"
definition = """
The run has synthesis (leg 1), review (leg 2 only if the ticket names a review turnpike),
and ship (leg 3). Leg 1 covers stages 0 and 1 plus checkpoint 1, and ends with handoff-1.md.
Leg 2 runs review turnpikes as one loop and ends with handoff-2.md. Leg 3 covers gates,
preview, QA, the card, merge on the word, style sort and teardown, and ends with handoff-3.md.
The leg list is derived by turnpikes.sh from the waybill. The stage order is dispatched,
bootstrapped, workhorses-running, synthesis, checkpoint-1, review, shipping, shipped, done,
abandoned. The postmaster owns leg, base and terminal stages; the coachman owns lanes and
nonterminal stage changes. Only the postmaster may set or leave done and abandoned.
"""

