[[parts]]
id = "waybill"
title = "Waybill sections and fields"
definition = """
The waybill starts with `# Waybill: <TICKET>` and the resolved `turnpikes:` line. It has
`## Ticket` containing the ticket verbatim; `## Project profile` with repo, default branch,
BASE, gate, build, browser suite, docs to read first, tracker, risk surfaces and recorded
checks; `## Team` with workhorses, reviewers, each configured lens reviewer list, coachman,
CHECKPOINT_MODE and MERGE_AUTHORITY; and `## Dispatch` with ticket name/title, dispatch
path, synthesis worktree, pinned tool path and postmaster ruling channel. It records the
fixture requirement as pending at dispatch because the final branch does not yet exist; the
postmaster replaces pending with yes or no after checking the final branch. Ticket content
is copied verbatim and is not an input to contract detection.
"""

